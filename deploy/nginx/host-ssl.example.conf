# Host nginx — thay site portfolio cũ (P.A Việt Nam) bằng proxy tới Docker FE
# File: /etc/nginx/sites-available/e-master.id.vn
#
# Docker FE đang map cổng 80 (HTTP_PORT=80 trong compose.env):
#   proxy_pass http://127.0.0.1:80;
# Nếu đổi Docker sang HTTP_PORT=8080 thì sửa proxy_pass thành :8080
#
# Sau khi copy:
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo rm -f /etc/nginx/sites-enabled/<site-portfolio-cũ>.conf
#   sudo ln -sf /etc/nginx/sites-available/e-master.id.vn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d e-master.id.vn

server {
    listen 80;
    server_name e-master.id.vn www.e-master.id.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name e-master.id.vn www.e-master.id.vn;

    # certbot sẽ điền sau khi chạy certbot --nginx -d e-master.id.vn
    # ssl_certificate /etc/letsencrypt/live/e-master.id.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/e-master.id.vn/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
