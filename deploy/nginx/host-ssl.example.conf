# Host nginx (161.248.147.104) — TLS terminate, proxy tới container frontend :80
# Đặt tại /etc/nginx/sites-available/e-master.id.vn
# certbot: certbot --nginx -d e-master.id.vn

server {
    listen 80;
    server_name e-master.id.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name e-master.id.vn;

    # ssl_certificate /etc/letsencrypt/live/e-master.id.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/e-master.id.vn/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
