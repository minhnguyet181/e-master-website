# Local / CI build — 3 service: mysql + backend + frontend
#   cp .env.example .env && cp Back-end/.env.example Back-end/.env
#   docker compose up -d --build
#
# Hot-reload FE: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

name: emaster

services:
  mysql:
    image: mysql:8.0
    container_name: emaster-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      MYSQL_DATABASE: ${DB_NAME:-e-master}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    networks:
      - emaster-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./Back-end
      dockerfile: Dockerfile
    image: emaster-backend:local
    container_name: emaster-backend
    restart: unless-stopped
    env_file:
      - ./Back-end/.env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      NODE_ENV: development
    ports:
      - "1818:1818"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - emaster-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1818/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./Front-end
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-/e-master}
        REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID:-}
    image: emaster-frontend:local
    container_name: emaster-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - emaster-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/e-master/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mysql_data:
    name: emaster_mysql_data

networks:
  emaster-net:
    name: emaster-net
