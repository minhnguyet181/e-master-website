name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ────────────────────────────────────────────────
  # JOB 1: Lint & basic checks
  # ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Back-end/package-lock.json
            Front-end/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: Back-end

      - name: Install frontend deps
        run: npm ci
        working-directory: Front-end

  # ────────────────────────────────────────────────
  # JOB 2: Build Docker images
  # ────────────────────────────────────────────────
  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: lint
    # Only build on push (not PRs)
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend image ──
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./Back-end
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/emaster-backend:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_REGISTRY }}/emaster-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend image ──
      - name: Build & push frontend
        env:
          # Same-origin qua nginx; override secret nếu cần URL tuyệt đối
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL || '/e-master' }}
        uses: docker/build-push-action@v5
        with:
          context: ./Front-end
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/emaster-frontend:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_REGISTRY }}/emaster-frontend:latest
          build-args: |
            REACT_APP_BACKEND_URL=${{ env.REACT_APP_BACKEND_URL }}
            REACT_APP_GOOGLE_CLIENT_ID=${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────
