name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'Front-end/**'
              - 'docker-compose.prod.yml'
              - 'Front-end/nginx.conf'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Back-end/package-lock.json
            Front-end/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: Back-end

      - name: Install frontend deps
        run: npm ci
        working-directory: Front-end

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./Back-end
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/emaster-backend:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_REGISTRY }}/emaster-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: github.event_name == 'push' && needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Front-end
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/emaster-frontend:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_REGISTRY }}/emaster-frontend:latest
          build-args: |
            REACT_APP_BACKEND_URL=${{ secrets.REACT_APP_BACKEND_URL || '/e-master' }}
            REACT_APP_GOOGLE_CLIENT_ID=${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, changes]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      always() && !cancelled() &&
      needs.build-backend.result == 'success' &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/emaster
            git pull --ff-only
            REGISTRY="${{ env.DOCKER_REGISTRY }}"
            TAG="${{ env.IMAGE_TAG }}"
            COMPOSE_ENV="deploy/env/compose.env"
            touch "$COMPOSE_ENV"
            grep -q '^IMAGE_TAG=' "$COMPOSE_ENV" && sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${TAG}/" "$COMPOSE_ENV" || echo "IMAGE_TAG=${TAG}" >> "$COMPOSE_ENV"
            grep -q '^DOCKER_REGISTRY=' "$COMPOSE_ENV" && sed -i "s|^DOCKER_REGISTRY=.*|DOCKER_REGISTRY=${REGISTRY}|" "$COMPOSE_ENV" || echo "DOCKER_REGISTRY=${REGISTRY}" >> "$COMPOSE_ENV"
            if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
              ./deploy/deploy.sh
            else
              ./deploy/deploy.sh backend
            fi
            docker image prune -f
