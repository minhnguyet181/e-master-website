upstream emaster_backend {
    server backend:1818;
    keepalive 8;
}

server {
    listen 80;
    # Production: e-master.id.vn (TLS thường do reverse proxy phía trước)
    server_name e-master.id.vn _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Health qua same-origin — map tới /health trên Express (healthcheck Docker dùng path này)
    location = /e-master/health {
        proxy_pass http://emaster_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /e-master/health/ai {
        proxy_pass http://emaster_backend/health/ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API — giữ prefix /e-master/ (Express: app.use('/e-master', routes))
    location /e-master/ {
        proxy_pass http://emaster_backend/e-master/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets (không match /e-master/)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router — fallback mọi route còn lại về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
