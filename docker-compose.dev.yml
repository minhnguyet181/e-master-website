services:
  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    container_name: emaster-frontend-dev
    restart: unless-stopped
    command: sh -c "npm ci && npm start"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:1818/e-master}
      REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID:-}
    volumes:
      - ./Front-end:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    networks:
      - emaster-net
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
    driver: local

networks:
  emaster-net:
    external: false
